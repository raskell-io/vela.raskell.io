# Zola configuration for the Vela website
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://vela.raskell.io"
title = "Vela"
description = "No-downtime app deployment on bare metal. One binary on your server and your laptop, no containers. Deploy Rust binaries and Elixir releases over SSH with health checks, automatic TLS and a built-in reverse proxy."
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_referrer = true
# Highlighting emits class names only; the colours live in sass/style.scss
# (Zola still writes giallo-*.css into static/; they are git-ignored and unused).
highlighting = { enabled = true, style = "class", light_theme = "github-light", dark_theme = "github-dark" }

[slugify]
paths = "on"
anchors = "on"

[extra]
pitch = "No-downtime deploys on bare metal"
version = "0.5.1"
# Canonical project description (raskell.io data/projects/vela.toml), used in the JSON-LD.
ld_description = "No-downtime app deployment on bare metal. One binary. No containers. A self-hosted PaaS alternative to Heroku, Fly.io, Coolify, and Kamal. Built in Rust with zero-downtime deploys and a built-in reverse proxy."
github = "https://github.com/raskell-io/vela"
docs = "https://github.com/raskell-io/vela/tree/main/docs"
releases = "https://github.com/raskell-io/vela/releases"
install = "curl -fsSL https://raw.githubusercontent.com/raskell-io/vela/main/install.sh | bash"
keywords = "Vela, deployment, zero downtime, blue-green deploy, bare metal, self-hosted PaaS, Heroku alternative, Kamal alternative, Rust, Elixir, Phoenix, reverse proxy, Let's Encrypt, SSH deploy"

nav_links = [
    { name = "Getting started", url = "/getting-started/" },
    { name = "Configuration", url = "/configuration/" },
    { name = "Docs", url = "https://github.com/raskell-io/vela/tree/main/docs" },
]
